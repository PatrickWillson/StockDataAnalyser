# Tool configuration. Dependencies live in requirements.txt / requirements-dev.txt.

# ---------------------------------------------------------------------------
# import-linter: architectural rules, checked by tests/test_architecture.py
# (or manually with: lint-imports)
#
# There are no exceptions (ignore_imports); never add one — fix the import instead.
# ---------------------------------------------------------------------------
# Only packages can be analysed: the top-level modules stock_data_analyser.py (CLI, top
# layer, may import anything) and logging_utils.py (imported only by the CLI) are not listed.
[tool.importlinter]
root_packages = [
    "clients",
    "core",
    "output",
    "config",
]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Layers: output | clients > core > config"
type = "layers"
layers = [
    "output | clients",
    "core",
    "config",
]

[[tool.importlinter.contracts]]
name = "Core does not depend on clients (no network/I/O in business logic)"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["clients"]

[[tool.importlinter.contracts]]
name = "Output does not depend on clients, directly or indirectly"
type = "forbidden"
source_modules = ["output"]
forbidden_modules = ["clients"]

# ---------------------------------------------------------------------------
# Coverage (opt-in, slower): pytest --cov
# Fails below fail_under; raise it as coverage improves, never lower it.
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["clients", "core", "output", "config", "stock_data_analyser", "logging_utils"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

# ---------------------------------------------------------------------------
# ruff: enforced by tests/test_lint.py (zero findings). Run: python3 -m ruff check .
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["claude-output", "data", ".kiro", ".idea"]

[tool.ruff.lint]
# F = pyflakes (unused imports/variables, undefined names, ...), E9 = syntax errors
select = ["F", "E9"]
